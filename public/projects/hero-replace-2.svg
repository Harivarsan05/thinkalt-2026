<svg xmlns="public\projects\Every Frame.jpg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g3" x1="0" x2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fee2b3"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#g3)"/>

  <!-- CTO-themed AI collaboration scene (abstract) -->
  <g transform="translate(180,80)">
    <rect x="0" y="0" width="1240" height="740" rx="16" fill="#ffffff" opacity="0.04"/>

    <!-- stylized person icons -->
    <g fill="#fb923c">
      <circle cx="420" cy="300" r="40"/>
      <rect x="390" y="350" width="60" height="80" rx="12"/>
      <circle cx="740" cy="340" r="40"/>
      <rect x="710" y="390" width="60" height="80" rx="12"/>
      <circle cx="1060" cy="300" r="40"/>
      <rect x="1030" y="350" width="60" height="80" rx="12"/>
    </g>

    <!-- connecting lines / network -->
    <g stroke="#fb923c" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M460 300 L700 320 L1000 300" stroke-opacity="0.7" />
      <path d="M420 340 L740 380" stroke-opacity="0.45" />
    </g>

    <text x="640" y="520" font-family="Inter, Arial, sans-serif" font-size="36" fill="#4a2e16" font-weight="700" text-anchor="middle">CTO+ — Leadership & Architecture</text>
  </g>
</svg>